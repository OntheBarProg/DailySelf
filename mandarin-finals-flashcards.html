<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mandarin Finals Flashcards</title>
<style>
  :root { --bg:#f4f6f3; --card:#fff; --ink:#1d2a22; --muted:#5f6f64; --accent:#2c6e49; --line:#d5ddd6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141a16; --card:#1f2721; --ink:#e8efe9; --muted:#9aab9f; --accent:#6fcf97; --line:#2f3a32; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui, "Segoe UI", sans-serif; }
  main { max-width:640px; margin:0 auto; padding:16px; }
  h1 { font-size:1.2rem; margin:8px 0 4px; }
  .rule { color:var(--muted); font-size:.9rem; margin:0 0 14px; }
  .decks { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  button { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:8px 12px; cursor:pointer; }
  button.on { background:var(--accent); color:var(--bg); border-color:var(--accent); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; min-height:260px; padding:24px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; cursor:pointer; user-select:none; }
  .tag { font-size:.75rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:12px; }
  .front { white-space:pre-line;  font-size:1.5rem; }
  .hz { font-size:2.2rem; margin-bottom:6px; }
  .py { font-size:1.6rem; color:var(--accent); font-weight:600; }
  .note { font-size:.95rem; color:var(--muted); margin-top:12px; white-space:pre-line; }
  .hint { font-size:.85rem; color:var(--muted); margin-top:18px; }
  .row { display:flex; gap:8px; justify-content:space-between; align-items:center; margin-top:12px; flex-wrap:wrap; }
  .count { color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
<main>
  <h1>Mandarin Finals Flashcards: M6 to M10 + Pronouns & Greetings</h1>
  <p class="rule">Say it OUT LOUD before you flip. Tap the card or press Space to flip, and use the arrow keys to move between cards.</p>
  <div class="decks" id="decks"></div>
  <div class="card" id="card"></div>
  <div class="row">
    <button id="prev">&larr; Prev</button>
    <span class="count" id="count"></span>
    <button id="next">Next &rarr;</button>
  </div>
  <div class="row">
    <button id="shuffle">Shuffle</button>
    <button id="reverse">Show pinyin first: off</button>
    <button id="speak">Hear it</button>
  </div>
</main>

let deckName = Object.keys(DECKS)[0], order = [], i = 0, flipped = false, reverse = false;
const $ = id => document.getElementById(id);

function load(name) {
  deckName = name; order = DECKS[name].map((_, k) => k); i = 0; flipped = false;
  document.querySelectorAll("#decks button").forEach(b => b.classList.toggle("on", b.textContent === name));
  render();
}
function esc(s) { return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
function render() {
  const [en, hz, py, note] = DECKS[deckName][order[i]];
  const isFacts = !hz;
  const showMandarin = reverse && !isFacts ? !flipped : flipped;
  let html;
  if (!showMandarin) {
    html = `<div class="tag">${isFacts ? "Answer out loud" : "Say it in Mandarin"}</div><div class="front">${esc(en)}</div>`;
  } else {
    html = (hz ? `<div class="hz">${esc(hz)}</div>` : "") + `<div class="py">${esc(py)}</div>`;
    if (reverse && !isFacts && !flipped) html = `<div class="tag">Read it aloud. What does it mean?</div>` + html;
    else if (!isFacts || note) html += (reverse && !isFacts ? `<div class="note">${esc(en)}</div>` : "") + (note ? `<div class="note">${esc(note)}</div>` : "");
  }
  html += `<div class="hint">${flipped ? "" : "Say it first, then tap to flip"}</div>`;
  $("card").innerHTML = html;
  $("count").textContent = `${i + 1} / ${order.length}`;
}
function move(d) { i = (i + d + order.length) % order.length; flipped = false; render(); }

Object.keys(DECKS).forEach(name => {
  const b = document.createElement("button"); b.textContent = name; b.onclick = () => load(name); $("decks").appendChild(b);
});
$("card").onclick = () => { flipped = !flipped; render(); };
$("prev").onclick = () => move(-1);
$("next").onclick = () => move(1);
$("shuffle").onclick = () => { for (let k = order.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [order[k], order[j]] = [order[j], order[k]]; } i = 0; flipped = false; render(); };
$("reverse").onclick = () => { reverse = !reverse; $("reverse").textContent = `Show pinyin first: ${reverse ? "on" : "off"}`; flipped = false; render(); };
$("speak").onclick = () => {
  const [, hz] = DECKS[deckName][order[i]];
  if (!hz || !("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(hz.replace(/___/g, ""));
  u.lang = "zh-CN"; u.rate = 0.8;
  const v = speechSynthesis.getVoices().find(v => v.lang.startsWith("zh"));
  if (!v) { alert("No Chinese voice installed on this device. Windows: Settings > Time & language > Speech > Add voices > Chinese (Simplified)."); return; }
  u.voice = v; speechSynthesis.cancel(); speechSynthesis.speak(u);
};
document.addEventListener("keydown", e => {
  if (e.key === " ") { e.preventDefault(); flipped = !flipped; render(); }
  if (e.key === "ArrowRight") move(1);
  if (e.key === "ArrowLeft") move(-1);
});
load(deckName);
</script>
